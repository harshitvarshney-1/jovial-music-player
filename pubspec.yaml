name: mymusicplayer_new
description: A Flutter music player application with background playback, downloads, and Firebase support.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # 🎨 UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  lottie: ^3.3.1
  marquee: ^2.3.0
  audio_video_progress_bar: ^2.0.3

  # 🎧 Audio
  just_audio: ^0.10.4
  just_audio_windows: ^0.2.0
  audioplayers: ^6.5.0
  on_audio_query: ^2.9.0

  # 🌐 Networking & Downloads
  dio: ^5.4.0
  http: ^1.2.0

  # 📁 Storage & Files
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2

  # 🔔 Notifications & Background
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.6.0

  # 🔐 Permissions & Media
  permission_handler: ^12.0.1
  image_picker: ^1.0.4

  # 🔥 Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_messaging: any

  # 🌍 Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # 🧠 State Management
  provider: ^6.1.1
  hydrated_bloc: ^10.1.1

  # 🧩 Dependency Injection & Utils
  get_it: ^8.0.2
  dartz: ^0.10.1

  # 🔗 Sharing
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/vectors/
